[Debug]

; Sets the level of detail in the log: 0 = trace, 1 = debug, 2 = info, 3 = warning, 4 = error, 5 = critical error
uLogLevel=0

[Requirements]

; 1 = a lock needs the Lockpicking skill below for its level before the picking menu will open
; (key-required locks are never touched). 0 = vanilla: any lock can be tried.
bLockRequirements=0

; Lockpicking skill needed per lock level, 0 to 100.
uNovice=0
uApprentice=25
uAdept=50
uExpert=75
uMaster=100

; 1 = with enough skill the lock opens without the minigame: one lockpick is used (none with the
; Unbreakable perk), Lockpicking rises as the game's own picking would raise it, and opening an
; owned lock is a crime unless you have Quick Hands. Uses the requirement values above.
bAutoPick=0

; 1 = after auto-picking, the chest or door is activated so it opens straight away.
bOpenAfterPick=1

[Smash]

; 1 = hitting a locked object with a weapon opens it when your weapon skill meets the level below.
bSmashLocks=0

; Which weapons may smash: 0 = two-handed only, 1 = one- and two-handed, 2 = any weapon (bows,
; crossbows and staves too; unarmed counts as one-handed).
uAllowedWeapons=1

; Weapon skill (One-handed or Two-handed) needed per lock level, 0 to 100.
uNovice=0
uApprentice=25
uAdept=50
uExpert=75
uMaster=100

[Spell]

; 1 = you know the Alteration spell "Manipulate Lock"; cast at a lock, it opens when your
; Alteration meets the level below. 0 = the spell is taken away.
bUnlockSpell=0

; Which spells work on locks: 0 = Manipulate Lock only; 1 = also Destruction: frost freezes a
; lock (easier to smash), fire thaws a frozen lock or opens it with enough Destruction;
; 2 = shock spells open locks as well.
uAllowedSpells=0

; Magic skill (Alteration for the spell, Destruction for fire and shock) needed per lock level.
uNovice=0
uApprentice=25
uAdept=50
uExpert=75
uMaster=100

; A frozen lock needs this much LESS weapon skill to smash, 0 to 100.
uFrostMalus=50

[PickAngle]

; 1 = when a lockpick breaks, the next pick starts at the same angle instead of resetting
; (Remember Lockpick Angle's behaviour, integrated). Stands down while RememberLockpickAngle.dll is loaded.
bRememberPickAngle=0

; A perk the character must have for the angle to be remembered: 0 = none, 1 = Locksmith,
; 2 = Unbreakable, 3 = Quick Hands, 4 = Wax Key, 5 = Golden Touch, 6 = Treasure Hunter,
; 7 = the custom perk named by the two keys below.
uRequiredPerk=0

; For uRequiredPerk=7: the plugin file that defines the perk and the perk's local form ID (hex or decimal).
sPerkPlugin=
uPerkFormID=0

[General]

; 1 = opening a lock through this mod raises the skill that opened it (the game's own amounts).
bSkillGain=1

; Multiplier on that skill gain, 0.1 to 5.
fSkillGainMult=1.0

; 1 = play a sound when a lock is smashed or opened by this mod.
bSound=1

; Volume of that sound, 0 to 1.
fSoundVolume=1.0

; 1 = opening a lock you do not own is a crime, witnessed by the game's own rules (followers and
; animals do not report you). 0 = never a crime.
bCrime=1

; The value the offence is reported at, in gold (what a witness will report you for).
uCrimeGold=5

; 1 = a short message on screen when this mod refuses, opens, freezes or thaws a lock.
bNotifications=1
